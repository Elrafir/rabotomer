<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: transparent; 
            margin: 0; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Позволяет кликать сквозь пустые области виджета, но не сквозь сам пузырек */
            -webkit-app-region: drag;
            user-select: none;
        }
        .bubble {
            background-color: rgba(31, 41, 55, 0.9); /* gray-800 */
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 9999px; /* full */
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s;
            cursor: pointer;
        }
        .bubble:hover {
            background-color: rgba(17, 24, 39, 0.95);
        }
        .bubble.paused {
            background-color: rgba(220, 38, 38, 0.9); /* red-600 */
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .icon-btn {
            -webkit-app-region: no-drag;
            cursor: pointer;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            transition: transform 0.1s, background 0.2s;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
        .icon-btn:active {
            transform: scale(0.95);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }
        .time-text {
            font-variant-numeric: tabular-nums;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body class="p-2">
    <!-- Обертка с отступами для тени -->
    <div id="bubbleContainer" class="bubble" style="display: none;">
        <!-- Иконка статуса / Пауза -->
        <div id="btnAction" class="icon-btn" title="Пауза/Старт">
            <span id="statusIcon">⏱️</span>
        </div>
        
        <!-- Время -->
        <div id="timeDisplay" class="time-text">00:00:00</div>
        
        <!-- Стоп -->
        <div id="btnStop" class="icon-btn bg-red-500 hover:bg-red-400" style="display: none;" title="Остановить">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12"></rect></svg>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        const bubbleContainer = document.getElementById('bubbleContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        const btnAction = document.getElementById('btnAction');
        const btnStop = document.getElementById('btnStop');
        const statusIcon = document.getElementById('statusIcon');
        
        // Слушаем обновления от главного процесса
        ipcRenderer.on('update-widget', (event, data) => {
            if (data.state === 'stopped' || !data.state) {
                bubbleContainer.style.display = 'none';
            } else {
                bubbleContainer.style.display = 'flex';
                
                // Форматирование времени
                const h = Math.floor(data.timeSeconds / 3600).toString().padStart(2, '0');
                const m = Math.floor((data.timeSeconds % 3600) / 60).toString().padStart(2, '0');
                const s = (data.timeSeconds % 60).toString().padStart(2, '0');
                timeDisplay.textContent = `${h}:${m}:${s}`;
                
                if (data.state === 'paused') {
                    bubbleContainer.classList.add('paused');
                    statusIcon.innerHTML = '▶️';
                    btnStop.style.display = 'flex';
                } else {
                    bubbleContainer.classList.remove('paused');
                    statusIcon.innerHTML = '⏸️';
                    btnStop.style.display = 'none';
                }
            }
        });
        
        // Отправка действий обратно в главное окно
        btnAction.addEventListener('click', (e) => {
            ipcRenderer.send('widget-action', 'toggle');
            e.stopPropagation(); // Не перетаскивать при клике
        });
        
        btnStop.addEventListener('click', (e) => {
            ipcRenderer.send('widget-action', 'stop');
            e.stopPropagation();
        });
        
        // Клик по самому пузырьку разворачивает главное окно
        bubbleContainer.addEventListener('dblclick', () => {
            ipcRenderer.send('widget-action', 'restore');
        });
    </script>
</body>
</html>
